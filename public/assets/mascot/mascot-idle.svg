<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mascotte Flaa's Squad — au repos">
  <!-- circuit mane -->
  <g stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M120 46 L120 14"/>
    <path d="M86 54 L62 26"/>
    <path d="M154 54 L178 26"/>
    <path d="M62 90 L24 84"/>
    <path d="M178 90 L216 84"/>
  </g>
  <g fill="var(--color-accent, currentColor)">
    <circle cx="120" cy="14" r="6"/>
    <circle cx="62" cy="26" r="5"/>
    <circle cx="178" cy="26" r="5"/>
    <circle cx="24" cy="84" r="5"/>
    <circle cx="216" cy="84" r="5"/>
  </g>

  <!-- head: faceted guardian face -->
  <polygon points="120,50 172,78 180,140 150,190 90,190 60,140 68,78"
    fill="var(--color-secondary, #0a3d62)" stroke="currentColor" stroke-width="4"/>

  <!-- circuit cheek accents -->
  <g stroke="var(--color-primary, currentColor)" stroke-width="3" fill="none" opacity="0.7">
    <path d="M76 110 L92 110 L92 128"/>
    <path d="M164 110 L148 110 L148 128"/>
  </g>

  <!-- eyes: idle, calm -->
  <g fill="var(--color-primary, currentColor)">
    <rect x="92" y="112" width="18" height="8" rx="4"/>
    <rect x="130" y="112" width="18" height="8" rx="4"/>
  </g>

  <!-- mouth: neutral -->
  <path d="M104 156 Q120 164 136 156" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
