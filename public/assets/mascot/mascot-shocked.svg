<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mascotte Flaa's Squad — choquée">
  <g stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M120 46 L120 10"/>
    <path d="M86 54 L56 20"/>
    <path d="M154 54 L184 20"/>
    <path d="M62 90 L18 78"/>
    <path d="M178 90 L222 78"/>
  </g>
  <g fill="var(--color-accent, currentColor)">
    <circle cx="120" cy="10" r="7"/>
    <circle cx="56" cy="20" r="6"/>
    <circle cx="184" cy="20" r="6"/>
    <circle cx="18" cy="78" r="6"/>
    <circle cx="222" cy="78" r="6"/>
  </g>

  <polygon points="120,50 172,78 180,140 150,190 90,190 60,140 68,78"
    fill="var(--color-secondary, #0a3d62)" stroke="currentColor" stroke-width="4"/>

  <!-- exclamation -->
  <g fill="var(--color-danger, #ff4d5e)">
    <rect x="115" y="30" width="10" height="6" rx="2" opacity="0"/>
  </g>
  <g stroke="var(--color-accent, currentColor)" stroke-width="7" stroke-linecap="round">
    <line x1="196" y1="40" x2="196" y2="60"/>
  </g>
  <circle cx="196" cy="70" r="4" fill="var(--color-accent, currentColor)"/>

  <!-- wide round eyes -->
  <g fill="var(--color-primary, currentColor)">
    <circle cx="101" cy="118" r="11"/>
    <circle cx="139" cy="118" r="11"/>
  </g>
  <g fill="var(--color-secondary, #0a3d62)">
    <circle cx="101" cy="118" r="4"/>
    <circle cx="139" cy="118" r="4"/>
  </g>

  <!-- open mouth "o" -->
  <ellipse cx="120" cy="160" rx="12" ry="16" fill="var(--color-secondary, #0a3d62)" stroke="currentColor" stroke-width="4"/>
</svg>
