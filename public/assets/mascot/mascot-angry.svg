<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mascotte Flaa's Squad — en colère">
  <g stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M120 46 L120 14"/>
    <path d="M86 54 L62 26"/>
    <path d="M154 54 L178 26"/>
    <path d="M62 90 L24 84"/>
    <path d="M178 90 L216 84"/>
  </g>
  <g fill="var(--color-danger, #ff4d5e)">
    <circle cx="120" cy="14" r="6"/>
    <circle cx="62" cy="26" r="5"/>
    <circle cx="178" cy="26" r="5"/>
    <circle cx="24" cy="84" r="5"/>
    <circle cx="216" cy="84" r="5"/>
  </g>

  <polygon points="120,50 172,78 180,140 150,190 90,190 60,140 68,78"
    fill="var(--color-secondary, #0a3d62)" stroke="var(--color-danger, #ff4d5e)" stroke-width="4"/>

  <!-- furrowed brows -->
  <g stroke="var(--color-danger, #ff4d5e)" stroke-width="6" stroke-linecap="round">
    <line x1="88" y1="104" x2="108" y2="114"/>
    <line x1="152" y1="104" x2="132" y2="114"/>
  </g>

  <!-- narrow eyes -->
  <g fill="var(--color-primary, currentColor)">
    <rect x="92" y="118" width="18" height="6" rx="3"/>
    <rect x="130" y="118" width="18" height="6" rx="3"/>
  </g>

  <!-- clenched mouth -->
  <path d="M100 158 Q120 150 140 158" stroke="var(--color-danger, #ff4d5e)" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
