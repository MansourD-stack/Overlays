<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Emblème Flaa's Squad — baobab-circuit">
  <polygon points="100,6 182,52 182,148 100,194 18,148 18,52"
    fill="none" stroke="var(--color-primary, currentColor)" stroke-width="4" opacity="0.9"/>
  <polygon points="100,20 170,59 170,141 100,180 30,141 30,59"
    fill="var(--color-secondary, transparent)" opacity="0.35"/>

  <!-- Trunk: central circuit bus -->
  <rect x="95" y="96" width="10" height="62" rx="2" fill="var(--color-primary, currentColor)"/>

  <!-- Branch traces -->
  <g stroke="var(--color-primary, currentColor)" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M100 100 L100 70 L72 50"/>
    <path d="M100 96 L100 66 L128 44"/>
    <path d="M100 92 L74 78 L50 78"/>
    <path d="M100 92 L126 78 L150 78"/>
    <path d="M100 80 L100 54"/>
  </g>

  <!-- Leaves / diode nodes -->
  <g fill="var(--color-accent, currentColor)">
    <circle cx="72" cy="50" r="7"/>
    <circle cx="128" cy="44" r="7"/>
    <circle cx="50" cy="78" r="6"/>
    <circle cx="150" cy="78" r="6"/>
    <circle cx="100" cy="50" r="7"/>
  </g>

  <!-- Root / base circuit pads -->
  <g fill="var(--color-primary, currentColor)" opacity="0.85">
    <rect x="80" y="158" width="14" height="6" rx="2"/>
    <rect x="106" y="158" width="14" height="6" rx="2"/>
  </g>
</svg>
